name: Verify NDD
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            powershell: ''
          # Keep CI stable during GitHub's ubuntu-latest image migrations.
          - os: ubuntu-24.04
            powershell: ''
          - os: windows-latest
            powershell: powershell
          - os: windows-latest
            powershell: pwsh
    runs-on: ${{ matrix.os }}
    env:
      NDD_TEST_POWERSHELL: ${{ matrix.powershell }}
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test installers, digests and distribution
        run: python -m unittest discover -s tests -v
      - name: Build current distribution
        run: python scripts/build_distribution.py
      - uses: actions/upload-artifact@v6
        with:
          name: ndd-${{ matrix.os }}-${{ matrix.powershell || 'bash' }}
          path: dist/*
